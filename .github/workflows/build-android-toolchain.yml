name: Build Android SDK

on:
  pull_request:
    branches:
      - main

env:
  SWIFT_VERSION: swift-6.2.1-RELEASE

jobs:

  build-swift-android-sdk:
    runs-on: [self-hosted, Linux, x64, Ubuntu]

    steps:
    - uses: actions/checkout@v4
    - name: Link persistent source cache
      run: ln -sfn "$HOME/swift-android-cache" ./android-sdk
    - name: Build sdk with docker
      run: sudo ./build-docker tag:${{ env.SWIFT_VERSION }} ./android-sdk
    - uses: actions/upload-artifact@v4
      with:
        name: readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
        path: ./android-sdk/products/readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
