name: Build Android SDK

on:
  pull_request:
    branches:
      - main

env:
  SWIFT_VERSION: swift-6.4.1-RELEASE

jobs:

  build-swift-android-sdk:
    # Skip PRs from forks so untrusted code never runs on our self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, x64, Ubuntu]

    steps:
    - uses: actions/checkout@v4
    # Sources are fetched fresh into the runner temp dir (outside the
    # checkout, as build-docker requires). Docker leaves root-owned files
    # there, so remove them with sudo before and after the build.
    - name: Remove leftovers of a previous run
      run: sudo rm -rf "$RUNNER_TEMP/swift-android-sdk"
    # Authenticate the ~200 git requests to github.com with the job token:
    # unauthenticated ones from the runner's IP get rate limited. Passed as
    # env-only git config (like actions/checkout), so nothing is written to
    # disk and nothing reaches the Docker container.
    - name: Build sdk with docker
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        sudo GIT_CONFIG_COUNT=1 \
             GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
             ./build-docker tag:${{ env.SWIFT_VERSION }} "$RUNNER_TEMP/swift-android-sdk"
    - uses: actions/upload-artifact@v4
      with:
        name: readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
        path: ${{ runner.temp }}/swift-android-sdk/products/readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
    - name: Clean up
      if: always()
      run: sudo rm -rf "$RUNNER_TEMP/swift-android-sdk"
