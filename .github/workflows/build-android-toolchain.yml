name: Build Android SDK

on:
  pull_request:
    branches:
      - main

env:
  SWIFT_VERSION: swift-6.4.1-RELEASE

jobs:

  build-swift-android-sdk:
    # Skip PRs from forks so untrusted code never runs on our self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, x64, Ubuntu]

    steps:
    - uses: actions/checkout@v4
    # Sources are fetched fresh into the runner temp dir (outside the
    # checkout, as build-docker requires). Docker leaves root-owned files
    # there, so remove them with sudo before and after the build.
    - name: Remove leftovers of a previous run
      run: sudo rm -rf "$RUNNER_TEMP/swift-android-sdk"
    # Fetching from github.com on this runner fails (outbound connections get
    # dropped), so use sources copied to the runner by hand when present.
    # The build modifies its source tree, so work on a copy.
    - name: Copy prepared Swift sources
      id: sources
      run: |
        prepared="$HOME/swift-android-sources/$SWIFT_VERSION"
        if [ -d "$prepared" ]; then
          mkdir -p "$RUNNER_TEMP/swift-android-sdk"
          cp -a "$prepared" "$RUNNER_TEMP/swift-android-sdk/source"
          echo "skip_fetch=--skip-fetch" >> "$GITHUB_OUTPUT"
        else
          echo "No prepared sources at $prepared, fetching from GitHub"
        fi
    - name: Build sdk with docker
      run: sudo ./build-docker ${{ steps.sources.outputs.skip_fetch }} tag:${{ env.SWIFT_VERSION }} "$RUNNER_TEMP/swift-android-sdk"
    - uses: actions/upload-artifact@v4
      with:
        name: readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
        path: ${{ runner.temp }}/swift-android-sdk/products/readdle-${{ env.SWIFT_VERSION }}_android.artifactbundle.tar.gz
    - name: Clean up
      if: always()
      run: sudo rm -rf "$RUNNER_TEMP/swift-android-sdk"
